
name: AWS Terraform Deployment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev-vpc
  cancel-in-progress: false

jobs:
  terraform:
    name: Terragrunt Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: live/dev/vpc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::283678155577:role/GitHubTerraformDeployRole
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Install Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: "latest"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check versions
        run: |
          terraform version
          terragrunt --version

      - name: Terragrunt Init
        run: terragrunt init -input=false

      - name: Terragrunt Plan
        run: terragrunt plan -input=false -no-color
