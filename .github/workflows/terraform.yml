
name: AWS Terraform Deployment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev-vpc
  cancel-in-progress: false

jobs:
  plan:
    name: Terragrunt Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: live/dev/vpc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::283678155577:role/GitHubTerraformDeployRole
          aws-region: us-east-1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Install Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: "latest"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Terragrunt Init
        run: terragrunt init -input=false

      - name: Terragrunt Plan
        run: terragrunt plan -input=false -no-color -out="$GITHUB_WORKSPACE/tfplan"
      
      - name: Publish Terraform Plan
        shell: bash
        run: |
          terragrunt show -no-color "$GITHUB_WORKSPACE/tfplan" > "$GITHUB_WORKSPACE/plan.txt"

          echo "## Terraform Plan - Dev VPC" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the proposed changes before approving deployment." >> "$GITHUB_STEP_SUMMARY"
          echo '```terraform' >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_WORKSPACE/plan.txt" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Terragrunt Apply
    needs: plan
    runs-on: ubuntu-latest

    environment:
      name: dev-apply

    defaults:
      run:
        working-directory: live/dev/vpc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ github.workspace }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::283678155577:role/GitHubTerraformDeployRole
          aws-region: us-east-1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Install Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: "latest"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Terragrunt Init
        run: terragrunt init -input=false

      - name: Terragrunt Apply
        run: terragrunt apply -input=false -no-color "$GITHUB_WORKSPACE/tfplan"
